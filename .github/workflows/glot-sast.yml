name: "SAST - Glot (ShellCheck)"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
  workflow_dispatch:  # Permite ejecución manual

permissions:
  security-events: write  # Requerido para subir SARIF
  contents: read

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Necesario para que Differential ShellCheck tenga historial completo[citation:3][citation:8]

      - name: Run ShellCheck
        id: shellcheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          scan-directory: 'scripts'
          exclude-path: |
            scripts/versions/**/*.sh
          # Traduce workflow_dispatch a "manual"
          triggering-event: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
          # Para modo manual, establece base y head al mismo commit para forzar un escaneo completo
          base: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          head: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4  # Actualizado a v4
        with:
          sarif_file: ${{ steps.shellcheck.outputs.sarif }}
          category: "shellcheck-glot"
